<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de contactos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Proyecto de aprendizaje</p>
      <h1>CRUD de contactos</h1>
      <p>Administra tus contactos: crea, consulta, edita y elimina.</p>
    </header>

    <section class="card">
      <h2 id="form-title">Nuevo contacto</h2>
      <form id="contact-form">
        <input id="contact-id" type="hidden">
        <label>Nombre
          <input id="name" type="text" placeholder="Ej. Ana Pérez" maxlength="60" required>
        </label>
        <label>Correo electrónico
          <input id="email" type="email" placeholder="ana@correo.com" maxlength="100" required>
        </label>
        <label>Teléfono
          <input id="phone" type="tel" placeholder="11 1234 5678" maxlength="30" required>
        </label>
        <div class="actions">
          <button id="save-button" type="submit">Guardar contacto</button>
          <button id="cancel-button" class="secondary hidden" type="button">Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Contactos</h2>
        <input id="search" type="search" placeholder="Buscar contacto" aria-label="Buscar contactos">
      </div>
      <p id="empty-state" class="empty">Aún no hay contactos registrados.</p>
      <div class="table-wrapper">
        <table id="contacts-table" class="hidden">
          <thead><tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr></thead>
          <tbody id="contacts-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
